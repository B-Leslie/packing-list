{{ define "bundle_child_row" }}
<li id="bc-{{ .ParentID }}-{{ .ChildID }}" style="display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 0.75rem; border-bottom: 1px solid #f1f3f4;">
  <a href="/bundles/{{ .ChildID }}" style="text-decoration: none; font-weight: 500; font-size: 0.95rem;">{{ .Name }}</a>
  <button class="icon-btn delete-btn" title="Remove"
          hx-delete="/bundles/{{ .ParentID }}/children/{{ .ChildID }}"
          hx-target="#bc-{{ .ParentID }}-{{ .ChildID }}" hx-swap="outerHTML">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
  </button>
</li>
{{ end }}
