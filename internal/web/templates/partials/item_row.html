{{ define "item_row" }}
<tr id="item-{{ .ID }}">
  <td>{{ .Name }}</td>
  <td>{{ .Category }}</td>
  <td class="text-center">{{ if .PerNight }}<span style="color: var(--app-accent); font-weight: bold;">✓</span>{{ else }}<span style="color: #ccc;">—</span>{{ end }}</td>
  <td class="text-right" style="font-family: 'Roboto Mono', monospace;">{{ formatQty .DefaultQty }}</td>
  <td style="text-align: right;">
    <div style="display: flex; justify-content: flex-end; gap: 0.25rem;">
      <button class="icon-btn" title="Edit"
              hx-get="/items/{{ .ID }}/edit" hx-target="#item-{{ .ID }}" hx-swap="outerHTML">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
      </button>
      <button class="icon-btn delete-btn" title="Delete"
              hx-delete="/items/{{ .ID }}" hx-target="#item-{{ .ID }}" hx-swap="outerHTML"
              hx-confirm="Move {{ .Name }} to Trash?">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
      </button>
    </div>
  </td>
</tr>
{{ end }}
