{{ define "trip_row" }}
<div style="position: relative;">
  <a href="/trips/{{ .ID }}" class="card">
    <h3 style="padding-right: 2rem;">{{ .Name }}</h3>
    <p>{{ .Nights }} night{{ if ne .Nights 1 }}s{{ end }}</p>
  </a>
  <button class="icon-btn delete-btn" title="Delete Trip"
          style="position: absolute; top: 0.75rem; right: 0.75rem;"
          hx-delete="/trips/{{ .ID }}" hx-target="closest div" hx-swap="outerHTML"
          hx-confirm="Move {{ .Name }} to Trash?">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
  </button>
</div>
{{ end }}
