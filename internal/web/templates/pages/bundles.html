{{ define "content" }}
<header>
  <h1>Bundles</h1>
  <p>Reusable groups of items for different types of trips.</p>
</header>

<div class="card" style="margin-bottom: 2rem; padding: 1.5rem;">
  <form hx-post="/bundles" hx-target="#bundle-rows" hx-swap="afterbegin" hx-on::after-request="this.reset()">
    <div style="display: grid; grid-template-columns: 1fr 2fr auto; gap: 1rem; align-items: end;">
      <div>
        <label>Bundle Name
          <input name="name" placeholder="e.g. Washbag" required />
        </label>
      </div>
      <div>
        <label>Description
          <input name="description" placeholder="Short description (optional)" />
        </label>
      </div>
      <div style="padding-bottom: 0.25rem;">
        <button type="submit" style="margin: 0;">Create Bundle</button>
      </div>
    </div>
  </form>
</div>

<table>
  <thead>
    <tr>
      <th>Name</th>
      <th>Description</th>
      <th style="width: 50px;"></th>
    </tr>
  </thead>
  <tbody id="bundle-rows">
    {{ range .Bundles }}{{ template "bundle_row" . }}{{ end }}
  </tbody>
</table>
{{ end }}
{{ template "layout" . }}
