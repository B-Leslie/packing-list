{{ define "content" }}
<header>
  <h1>Trips</h1>
  <a class="contrast" role="button" href="/trips/new">New trip</a>
</header>
{{ if not .Trips }}
  <p>No trips yet. <a href="/trips/new">Create your first one.</a></p>
{{ else }}
<ul>{{ range .Trips }}{{ template "trip_row" . }}{{ end }}</ul>
{{ end }}
{{ end }}
{{ template "layout" . }}
