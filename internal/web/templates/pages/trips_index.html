{{ define "content" }}
<div class="quick-add">
  <form hx-post="/trips" hx-target="main" style="display:flex;width:100%;align-items:center;gap:1rem">
    <input name="name" placeholder="Quickly create a new trip..." required style="flex:1" />
    <input type="hidden" name="nights" value="1" />
    <button class="outline" style="padding:.25rem .75rem;margin:0">Create</button>
  </form>
</div>

{{ if not .Trips }}
  <div class="empty-state">
    <div class="icon">🧳</div>
    <h2>No trips yet</h2>
    <p>Your upcoming adventures will appear here.</p>
    <a href="/trips/new" role="button">Create your first trip</a>
  </div>
{{ else }}
  <div class="card-grid">
    {{ range .Trips }}{{ template "trip_row" . }}{{ end }}
  </div>
{{ end }}
{{ end }}
{{ template "layout" . }}
